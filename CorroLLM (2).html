<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CorroLLM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f0;--panel:#fff;--ink:#14201e;--mute:#5b6b68;--line:#d3dcd9;--verd:#168a76;--low:#2f9e6b;--mod:#c99a14;--high:#d9742b;--crit:#c2362b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--panel:#152120;--ink:#e6efec;--mute:#8fa5a0;--line:#25373a;--verd:#46c3a8;--low:#4cc38a;--mod:#e6b93a;--high:#f08a3e;--crit:#ef5a4c}}
:root[data-theme="dark"]{--bg:#0e1514;--panel:#152120;--ink:#e6efec;--mute:#8fa5a0;--line:#25373a;--verd:#46c3a8;--low:#4cc38a;--mod:#e6b93a;--high:#f08a3e;--crit:#ef5a4c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;margin:0;letter-spacing:-.02em}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.brand{font:800 28px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}.brand i{font-style:normal;color:var(--verd)}
header p{margin:0;color:var(--mute);max-width:46ch}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.stage{position:relative;min-height:380px;display:grid;place-items:center;overflow:hidden;padding:0;border-radius:18px}
.stage canvas{display:none;width:100%;height:auto;max-height:70vh;object-fit:contain}
.stage.has canvas{display:block}.stage.has .drop{display:none}
.drop{text-align:center;padding:40px 24px;cursor:pointer;width:100%;height:100%;display:grid;place-content:center;gap:10px;border:2px dashed var(--line);border-radius:18px;margin:0;transition:border-color .2s,background .2s}
.drop:hover,.drop.over,.drop:focus-visible{border-color:var(--verd);background:color-mix(in srgb,var(--verd) 7%,transparent);outline:none}
.drop h2{font-size:26px}.drop span{color:var(--mute)}
.scan{position:absolute;left:0;right:0;height:3px;background:var(--verd);box-shadow:0 0 24px 8px var(--verd);top:0;opacity:0;pointer-events:none}
.stage.busy .scan{opacity:.9;animation:sweep 1.3s ease-in-out infinite alternate}
@keyframes sweep{to{top:calc(100% - 3px)}}
label,.lbl{font-weight:600;font-size:14px;display:block;margin-bottom:8px}
.mats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.mats button{font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.mats button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text]{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);margin-bottom:20px}
button:focus-visible,input:focus-visible{outline:2px solid var(--verd);outline-offset:2px}
.go{width:100%;font:700 17px "Bricolage Grotesque",sans-serif;padding:14px;border:0;border-radius:12px;background:var(--verd);color:#04130f;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px;padding:9px 14px;border-radius:10px;cursor:pointer;margin-top:10px;width:100%}
.hint{color:var(--mute);font-size:13px;margin:12px 0 0}
.live{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--verd);color:var(--verd);text-decoration:none;background:color-mix(in srgb,var(--verd) 10%,transparent);transition:background .2s,color .2s}
.live:hover,.live:focus-visible{background:var(--verd);color:#04130f;outline:none}
.live .pulse{position:relative;width:9px;height:9px;border-radius:50%;background:currentColor}
.live .pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(.5);opacity:.9}to{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.live .pulse::after{animation:none;opacity:.4}}
#custom{display:none;margin:-8px 0 20px}#custom.on{display:block}
#custom textarea{width:100%;font:inherit;font-size:14px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);resize:vertical;min-height:84px}
.swap{display:none;position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;background:var(--panel);color:var(--ink);border:1px solid var(--line);place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);margin:0}
.stage.has .swap{display:grid}.swap:hover,.swap:focus-visible{border-color:var(--verd);color:var(--verd);outline:none}
#results{display:none;margin-top:28px}#results.on{display:block}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;border-left:8px solid var(--sev);margin-bottom:20px}
@media(max-width:600px){.verdict{grid-template-columns:1fr}}
.verdict .big{font:800 clamp(44px,9vw,84px)/.9 "Bricolage Grotesque",sans-serif;color:var(--sev);letter-spacing:-.04em}
.verdict p{margin:0;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:12px}.stat b{display:block;font:700 28px "Bricolage Grotesque",sans-serif}.stat span{color:var(--mute);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}@media(max-width:820px){.two{grid-template-columns:1fr}}
.card h3{font-size:20px;margin-bottom:14px}
.det{padding:12px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:start}
.det:first-of-type{border-top:0}.dot{width:14px;height:14px;border-radius:4px;margin-top:5px}
.det small{color:var(--mute);display:block}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--verd)}
ul{margin:8px 0 0;padding-left:18px;color:var(--mute)}li{margin:3px 0}
.rec{padding:12px 0;border-top:1px solid var(--line)}.rec:first-of-type{border-top:0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid currentColor;margin-right:6px}
.prev{columns:2 280px;column-gap:32px;margin:0;padding-left:18px;color:var(--ink)}
.credit{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:40px;color:var(--mute);font-size:14px}
.credit img{flex:none;border-radius:50%;box-shadow:0 2px 14px rgba(0,0,0,.35)}.credit b{color:var(--ink);font-weight:600}
@media print{.grid,header .tools,.go,.ghost{display:none}body{background:#fff}}
@media (prefers-reduced-motion:reduce){.stage.busy .scan{animation:none;top:50%}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">Corro<i>LLM</i></div>
  <p>Upload a photo of a steel, aluminum or copper surface. Get a marked-up image, a severity rating and a maintenance plan.</p>
</header>

<div class="grid">
  <div class="card stage" id="stage">
    <label class="drop" id="drop" tabindex="0" for="file">
      <h2>Drop an inspection photo here</h2>
      <span>or tap to choose one. The image stays in your browser.</span>
    </label>
    <canvas id="cv" aria-label="Annotated inspection image"></canvas>
    <div class="scan"></div>
    <label class="swap" for="file" tabindex="0" id="swap" title="Upload another image" aria-label="Upload another image"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></label>
  </div>
  <input type="file" id="file" accept="image/*" hidden>

  <div class="card">
    <span class="lbl">Material</span>
    <div class="mats" id="mats">
      <button aria-pressed="true">Carbon Steel</button><button aria-pressed="false">Stainless Steel</button><button aria-pressed="false">Aluminum Alloy</button><button aria-pressed="false">Galvanized Steel</button><button aria-pressed="false">Copper/Brass</button><button aria-pressed="false" id="otherBtn">Other (write it in)</button><a class="live" id="liveLink" href="https://app.roboflow.com/corrollm/corrollm_-in_pipe_corrosion_and_cracks-by4am/models/corrollm_-in_pipe_corrosion_and_cracks-by4am/1" target="_blank" rel="noopener noreferrer" title="Opens the live Roboflow model in a new tab"><span class="pulse" aria-hidden="true"></span>Real-time analysis<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
    </div>
    <div id="custom"><label for="customMat">Material and composition</label><textarea id="customMat" placeholder="e.g. Duplex stainless steel 2205, 22% Cr, 5% Ni, 3% Mo"></textarea></div>
    <label for="loc">Location (optional)</label>
    <input type="text" id="loc" placeholder="e.g. Pipe rack B, north flange">
    <button class="go" id="run" disabled>Analyze corrosion</button>
    <button class="ghost" id="sample">Try a sample image</button>
    <button class="ghost" id="print" style="display:none">Print or save as PDF</button>
    <p class="hint" id="hint">Add an image to begin.</p>
  </div>
</div>

<section id="results" aria-live="polite">
  <div class="card verdict" id="verdict"><div class="big" id="sev"></div><p id="summary"></p></div>
  <div class="stats" id="stats"></div>
  <div class="two">
    <div class="card"><h3>Detected zones</h3><div id="dets"></div></div>
    <div class="card"><h3>Likely root causes</h3><div id="rca"></div></div>
  </div>
  <div class="card" style="margin-bottom:20px"><h3>Recommended actions</h3><div id="recs"></div></div>
  <div class="card"><h3>Prevention checklist</h3><ul class="prev" id="prev"></ul></div>
</section>

rec:{critical:[['Immediate structural integrity assessment','immediate','$5,000–$15,000','24–48 hours'],['Emergency corrosion control measures','immediate','$3,000–$10,000','1 week']],
high:[['Comprehensive corrosion assessment','urgent','$3,000–$8,000','1–2 weeks'],['Surface preparation and recoating','short term','$30–$80/m²','1–2 months']],
moderate:[['Schedule coating renewal','short term','$25–$60/m²','3–6 months'],['Enhanced monitoring program','short term','$2,000–$5,000/year','Ongoing']],
low:[['Continue routine inspections','maintenance','$1,000–$3,000/year','Quarterly'],['Monitor corrosion progression','maintenance','$500–$2,000/year','Ongoing']]}};
const SEV={low:'--low',moderate:'--mod',high:'--high',critical:'--crit'},RANK={low:1,moderate:2,high:3,critical:4};
const $=id=>document.getElementById(id);
let img=null,material='Carbon Steel',data=null;

// Port of CorrosionAnalyzer: edge map -> candidate regions -> classify (runs on a downscaled copy; all ratios are scale-free)
function analyze(src){
  const S=Math.min(1,640/Math.max(src.width,src.height)),w=Math.round(src.width*S),h=Math.round(src.height*S);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,w,h);
  const px=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);let sum=0;
  for(let i=0;i<w*h;i++){g[i]=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];sum+=g[i]}
  const mean=sum/(w*h),e=new Uint8Array(w*h);
  for(let y=1;y<h-1;y++)for(let xx=1;xx<w-1;xx++){const i=y*w+xx;
    const gx=g[i-w+1]+2*g[i+1]+g[i+w+1]-g[i-w-1]-2*g[i-1]-g[i+w-1],gy=g[i+w-1]+2*g[i+w]+g[i+w+1]-g[i-w-1]-2*g[i-w]-g[i-w+1];
    if(Math.hypot(gx,gy)>60)e[i]=1}
  const d=new Uint8Array(w*h),R=4; // dilate so edge fragments merge into regions
  for(let y=R;y<h-R;y++)for(let xx=R;xx<w-R;xx++)if(e[y*w+xx])for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++)d[(y+dy)*w+xx+dx]=1;
  const seen=new Uint8Array(w*h),regs=[];
  for(let s=0;s<w*h;s++){if(!d[s]||seen[s])continue;const st=[s];seen[s]=1;let n=0,x0=w,y0=h,x1=0,y1=0;
    while(st.length){const i=st.pop(),px_=i%w,py=(i/w)|0;n++;if(px_<x0)x0=px_;if(px_>x1)x1=px_;if(py<y0)y0=py;if(py>y1)y1=py;
      for(const j of [i-1,i+1,i-w,i+w])if(j>=0&&j<w*h&&d[j]&&!seen[j]){seen[j]=1;st.push(j)}}
    regs.push({n,x0,y0,x1,y1})}
  regs.sort((a,b)=>b.n-a.n);const tot=w*h,det=[];
  for(const r of regs.slice(0,8)){const ratio=r.n/tot;if(ratio<.008)continue;
    let rs=0,rc=0,rs2=0;for(let y=r.y0;y<=r.y1;y++)for(let xx=r.x0;xx<=r.x1;xx++){rs+=g[y*w+xx];rs2+=g[y*w+xx]**2;rc++}
    const rm=rs/rc,rsd=Math.sqrt(Math.max(0,rs2/rc-rm*rm));
    const type=ratio>.25?'uniform':rm<mean*.65?'pitting':ratio>.15?'erosion':['crevice','galvanic','stress cracking'][Math.floor(rsd)%3];
    const sc=ratio*.6+(1-rm/255)*.4,severity=sc>.65?'critical':sc>.45?'high':sc>.25?'moderate':'low';
    det.push({type,severity,conf:Math.min(.95,.68+ratio*1.8),bbox:[r.x0/S,r.y0/S,r.x1/S,r.y1/S],area:ratio*100})}
  if(!det.length)det.push({type:mean<128?'uniform':'pitting',severity:'moderate',conf:.72,bbox:[src.width/4,src.height/4,3*src.width/4,3*src.height/4],area:20});
  const dets=det.slice(0,5),sev=Object.keys(RANK).find(k=>RANK[k]==Math.max(...dets.map(q=>RANK[q.severity])));
  return{dets,sev,area:Math.min(100,dets.reduce((a,q)=>a+q.area,0))}
}
function rca(dets,m){const t=new Set(dets.map(d=>d.type)),o=[];
  if(t.has('pitting'))o.push({c:'Localized electrochemical cell formation (pitting corrosion)',p:.84,ev:['Pitting pattern indicates anodic dissolution sites','Typical of chloride or sulfide contamination','Passive film breakdown in localized areas']});
  if(t.has('uniform'))o.push({c:'General atmospheric corrosion',p:.81,ev:['Uniform attack pattern across surface',m+' susceptible to oxidation','Environmental exposure without adequate protection']});
  if(m.toLowerCase().includes('steel'))o.push({c:'Iron oxide formation on steel substrate',p:.87,ev:['Material: '+m,'Moisture and oxygen exposure','Coating absence or degradation']});
  return o.length?o:[{c:'Environmental corrosion',p:.75,ev:['General corrosion mechanisms']}]}
function summary(a,m){let s=`Computer vision analysis found ${a.dets.length} corrosion zone${a.dets.length>1?'s':''} covering ${a.area.toFixed(1)}% of the ${m} surface. `;
  s+={critical:'Critical severity needs immediate intervention to prevent failure.',high:'High severity calls for urgent repair within 30 days.',moderate:'Moderate severity suggests maintenance within 3–6 months.',low:'Low severity: routine monitoring is enough.'}[a.sev];return s}

function draw(a){const cv=$('cv');cv.width=img.width;cv.height=img.height;const x=cv.getContext('2d');x.drawImage(img,0,0);
  const lw=Math.max(3,img.width/260),fs=Math.max(14,img.width/50),css=getComputedStyle(document.documentElement);
  x.font=`600 ${fs}px "Instrument Sans",sans-serif`;
  if(a)for(const d of a.dets){const col=css.getPropertyValue(SEV[d.severity]).trim()||'#d9742b',[x0,y0,x1,y1]=d.bbox;
    x.strokeStyle=col;x.lineWidth=lw;x.strokeRect(x0,y0,x1-x0,y1-y0);
    const t=d.type+' · '+d.severity,tw=x.measureText(t).width+fs;x.fillStyle=col;x.fillRect(x0,Math.max(0,y0-fs*1.6),tw,fs*1.6);
    x.fillStyle='#000';x.fillText(t,x0+fs/2,Math.max(0,y0-fs*1.6)+fs*1.15)}}
function load(src){const i=new Image();i.onload=()=>{img=i;$('stage').classList.add('has');draw();$('run').disabled=false;$('hint').textContent='Choose a material, then run the analysis.';$('results').classList.remove('on')};i.src=src}
$('file').onchange=e=>{const f=e.target.files[0];if(f){load(URL.createObjectURL(f));$('print').style.display='none'}e.target.value=''};
const dz=$('drop');['dragover','dragenter'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)load(URL.createObjectURL(f))});
dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});
function pickMat(){const o=$('otherBtn').getAttribute('aria-pressed')==='true';$('custom').classList.toggle('on',o);if(o)material=$('customMat').value.trim()||'Custom material'}
$('mats').onclick=e=>{if(e.target.tagName!=='BUTTON')return;[...$('mats').querySelectorAll('button')].forEach(b=>b.setAttribute('aria-pressed',b===e.target));material=e.target.textContent;pickMat();if(e.target.id==='otherBtn')$('customMat').focus()};
$('customMat').oninput=pickMat;
$('swap').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});
$('sample').onclick=()=>{const c=document.createElement('canvas');c.width=900;c.height=600;const x=c.getContext('2d');
  x.fillStyle='#6f7478';x.fillRect(0,0,900,600);
  for(let i=0;i<5000;i++){x.fillStyle=`rgba(${90+Math.random()*40},${96+Math.random()*30},${100+Math.random()*30},.5)`;x.fillRect(Math.random()*900,Math.random()*600,2+Math.random()*5,1+Math.random()*3)}
  [[200,200,130],[620,180,90],[480,430,150],[150,470,60]].forEach(([cx,cy,r])=>{for(let i=0;i<900;i++){const a=Math.random()*6.28,d=Math.random()**.6*r;x.fillStyle=`rgba(${120+Math.random()*60},${50+Math.random()*30},${20+Math.random()*20},${.35+Math.random()*.5})`;x.beginPath();x.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d*.8,2+Math.random()*7,0,6.28);x.fill()}});
  load(c.toDataURL())};
$('run').onclick=()=>{const st=$('stage');st.classList.add('busy');$('run').disabled=true;$('hint').textContent='Scanning…';
  setTimeout(()=>{const a=analyze(img);data=a;draw(a);show(a);st.classList.remove('busy');$('run').disabled=false;$('hint').textContent='Done. Change the material and run again to compare.';$('print').style.display='block';
    $('results').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})},1400)};
$('print').onclick=()=>window.print();
function show(a){const col=`var(${SEV[a.sev]})`,loc=$('loc').value.trim();
  $('verdict').style.setProperty('--sev',col);$('sev').textContent=a.sev[0].toUpperCase()+a.sev.slice(1);$('summary').textContent=summary(a,material);
  $('stats').innerHTML=[[a.dets.length,'zones detected'],[a.area.toFixed(1)+'%','surface affected'],[material,'material'],[loc||'Not given','location']].map(([v,l])=>`<div class="stat"><b>${v.toString().replace(/</g,'&lt;')}</b><span>${l}</span></div>`).join('');
  $('dets').innerHTML=a.dets.map(d=>`<div class="det"><span class="dot" style="background:var(${SEV[d.severity]})"></span><div><strong>${d.type[0].toUpperCase()+d.type.slice(1)}</strong><small>${d.severity} severity · ${d.area.toFixed(1)}% of image</small><div class="bar"><i style="width:${d.conf*100}%"></i></div></div><span>${Math.round(d.conf*100)}%</span></div>`).join('');
  $('rca').innerHTML=rca(a.dets,material).map(r=>`<div class="rec"><strong>${r.c}</strong> <span class="tag" style="color:var(--verd)">${Math.round(r.p*100)}%</span><ul>${r.ev.map(v=>`<li>${v}</li>`).join('')}</ul></div>`).join('');
  $('recs').innerHTML=KB.rec[a.sev].map(r=>`<div class="rec"><strong>${r[0]}</strong><div><span class="tag" style="color:var(${SEV[a.sev]})">${r[1]}</span><span style="color:var(--mute)">Cost ${r[2]} · Timeline ${r[3]}</span></div></div>`).join('');
  $('prev').innerHTML=KB.prev.map(p=>`<li>${p}</li>`).join('');$('results').classList.add('on')}
</script>
</body>
</html>
